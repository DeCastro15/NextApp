<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Senha | Next</title>
    <style>
      :root {
        --blue: #2f73f8;
        --ink: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --soft: #f5f7fb;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, rgba(47, 115, 248, 0.12), transparent 36%), var(--soft);
        color: var(--ink);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .card {
        width: min(420px, 100%);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 24px;
        box-shadow: 0 18px 60px rgba(17, 24, 39, 0.1);
      }
      h2 { margin: 0 0 6px; font-size: 1.6rem; }
      p { margin: 0 0 20px; color: var(--muted); }
      form { display: grid; gap: 14px; }
      label { display: grid; gap: 8px; color: #374151; font-weight: 800; }
      input {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        outline: none;
      }
      input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(47, 115, 248, 0.12); }
      button {
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: var(--blue);
        color: #fff;
        font-weight: 900;
        cursor: pointer;
      }
      .message { min-height: 22px; margin: 0; font-weight: 750; }
    </style>
  </head>
  <body>
    <main class="card">
      <h2>Criar Nova Senha</h2>
      <p>Digite a sua nova senha de acesso abaixo.</p>

      <form id="newPasswordForm">
        <label>
          Nova Senha (mínimo 6 caracteres)
          <input id="newPassword" type="password" minlength="6" required />
        </label>
        <button type="submit">Salvar nova senha</button>
        <p class="message" id="resetMsg" role="status"></p>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
      // Ativa o cliente real do Supabase independente do MOCK para esta tela de segurança
      const supabase = originalSupabaseClient || (window.supabase ? window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey) : null);

      document.querySelector("#newPasswordForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const msg = document.querySelector("#resetMsg");
        const password = document.querySelector("#newPassword").value;
        
        msg.textContent = "Atualizando senha...";
        msg.style.color = "var(--ink)";

        if (USE_MOCK_DB) {
          // Comportamento simulado local
          setTimeout(() => {
            msg.textContent = "Senha atualizada! Redirecionando...";
            msg.style.color = "#10b981";
            setTimeout(() => { window.location.href = "index.html"; }, 2000);
          }, 1000);
        } else {
          // Comportamento real na nuvem do Supabase
          const { error } = await supabase.auth.updateUser({ password: password });
          
          if (error) {
            msg.textContent = "Erro: " + error.message;
            msg.style.color = "#b91c1c";
          } else {
            msg.textContent = "Senha alterada com sucesso! Redirecionando...";
            msg.style.color = "#10b981";
            setTimeout(() => { window.location.href = "index.html"; }, 2000);
          }
        }
      });
    </script>
  </body>
</html>

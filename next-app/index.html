<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Next</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&display=swap');

      :root {
        --blue: #2f73f8;
        --ink: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --soft: #f5f7fb;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0f1e;
        color: var(--ink);
        font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
        overflow-x: hidden;
      }

      /* Fundo animado com partículas */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 60% at 20% 10%, rgba(47,115,248,0.22) 0%, transparent 60%),
          radial-gradient(ellipse 60% 50% at 80% 80%, rgba(183,255,60,0.09) 0%, transparent 55%),
          radial-gradient(ellipse 40% 30% at 60% 20%, rgba(255,77,141,0.07) 0%, transparent 50%);
        animation: bgPulse 8s ease-in-out infinite alternate;
        pointer-events: none;
        z-index: 0;
      }

      @keyframes bgPulse {
        from { opacity: 0.7; }
        to { opacity: 1; }
      }

      .login-shell {
        position: relative;
        z-index: 1;
        width: min(980px, 100%);
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(320px, 0.68fr);
        gap: 20px;
        align-items: stretch;
        animation: shellEnter 600ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
        transform: translateY(24px);
      }

      @keyframes shellEnter {
        to { opacity: 1; transform: translateY(0); }
      }

      /* Painel esquerdo (intro) */
      .intro {
        min-height: 520px;
        display: grid;
        align-content: space-between;
        padding: 32px;
        border-radius: 16px;
        color: #fff;
        background:
          linear-gradient(145deg, rgba(47,115,248,0.95) 0%, rgba(10,15,30,0.92) 100%),
          #0a0f1e;
        border: 1px solid rgba(47,115,248,0.4);
        box-shadow: 0 32px 80px rgba(47,115,248,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
        overflow: hidden;
        position: relative;
      }

      .intro::after {
        content: '';
        position: absolute;
        top: -60px; right: -60px;
        width: 320px; height: 320px;
        background: radial-gradient(circle, rgba(183,255,60,0.18) 0%, transparent 70%);
        border-radius: 50%;
        animation: orbFloat 6s ease-in-out infinite alternate;
      }

      @keyframes orbFloat {
        from { transform: translate(0, 0) scale(1); }
        to   { transform: translate(-20px, 20px) scale(1.1); }
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        position: relative;
        z-index: 1;
      }

      .brand img {
        width: 58px; height: 58px;
        border-radius: 10px;
        object-fit: cover;
        box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      }

      .eyebrow {
        margin: 0 0 5px;
        color: rgba(255,255,255,0.55);
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .intro-bottom {
        position: relative;
        z-index: 1;
      }

      .intro h1 {
        max-width: 620px;
        margin: 0 0 16px;
        font-size: clamp(2.4rem, 5.5vw, 4.4rem);
        line-height: 0.96;
        letter-spacing: -0.02em;
      }

      .intro h1 span {
        color: #b7ff3c;
      }

      .intro > .intro-bottom > p {
        max-width: 480px;
        color: rgba(255,255,255,0.72);
        font-weight: 650;
        font-size: 1rem;
        line-height: 1.55;
      }

      /* Frase de fé */
      .faith-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 0.82rem;
        font-weight: 800;
        color: rgba(255,255,255,0.9);
        margin-bottom: 18px;
        backdrop-filter: blur(8px);
        animation: tagPop 400ms 500ms cubic-bezier(0.34,1.56,0.64,1) both;
      }

      @keyframes tagPop {
        from { opacity: 0; transform: scale(0.8); }
        to   { opacity: 1; transform: scale(1); }
      }

      /* Card de login (direita) */
      .login-card {
        padding: 28px;
        border-radius: 16px;
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: 0 24px 64px rgba(17,24,39,0.12);
      }

      .login-card h2 {
        margin: 0 0 6px;
        font-size: 1.65rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .login-card > p {
        margin: 0 0 22px;
        color: var(--muted);
      }

      form { display: grid; gap: 14px; }

      label {
        display: grid;
        gap: 8px;
        color: #374151;
        font-weight: 800;
        font-size: 0.9rem;
      }

      input {
        width: 100%;
        min-height: 48px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 0 14px;
        color: var(--ink);
        font: inherit;
        outline: none;
        transition: border-color 160ms, box-shadow 160ms;
      }

      input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(47,115,248,0.12);
      }

      button[type="submit"], .btn-primary {
        min-height: 50px;
        border: 0;
        border-radius: 10px;
        background: var(--blue);
        color: #fff;
        font: inherit;
        font-weight: 900;
        font-size: 0.95rem;
        cursor: pointer;
        transition: background 160ms, transform 80ms, box-shadow 160ms;
        box-shadow: 0 8px 20px rgba(47,115,248,0.3);
      }

      button[type="submit"]:hover {
        background: #1655d5;
        box-shadow: 0 10px 28px rgba(47,115,248,0.45);
      }

      button[type="submit"]:active {
        transform: scale(0.98);
      }

      .message {
        min-height: 22px;
        margin: 0;
        color: #b91c1c;
        font-weight: 750;
        font-size: 0.88rem;
      }

      #toggleFormBtn {
        margin-top: 14px;
        width: 100%;
        background: transparent;
        color: var(--blue);
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        cursor: pointer;
        font-weight: 800;
        font: inherit;
        font-weight: 800;
        transition: border-color 160ms, background 160ms;
      }

      #toggleFormBtn:hover {
        border-color: var(--blue);
        background: #f0f6ff;
      }

      @media (max-width: 820px) {
        body { padding: 16px; }

        .login-shell {
          grid-template-columns: 1fr;
        }

        .intro {
          min-height: 300px;
          padding: 24px;
        }

        .intro h1 {
          font-size: 2.2rem;
        }
      }

      @media (max-width: 480px) {
        body { padding: 12px; }

        .login-card { padding: 20px; }

        .intro h1 { font-size: 1.9rem; }
      }
  </style>
  </head>
  <body>
    <main class="login-shell">
      <section class="intro">
        <div class="brand">
          <img src="assets/next-logo.svg" alt="Next" />
          <div>
            <p class="eyebrow">AD Fonte de Vida</p>
            <strong>Juventude Next</strong>
          </div>
        </div>

        <div class="intro-bottom">
          <div class="faith-tag">🔥 A gen that burns for Jesus</div>
          <h1>Seu <span>próximo</span><br>passo com o Next</h1>
          <p>Acesse avisos, agenda, pedidos de oração, loja, conteúdos e conversas com a liderança.</p>
        </div>
      </section>

      <section class="login-card">
        <h2 id="cardTitle">Entrar</h2>
        <p id="cardDesc">Use uma conta cadastrada ou crie a sua.</p>

        <form id="loginForm">
          <label>
            E-mail
            <input id="email" type="email" autocomplete="email" required />
          </label>
          <label>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              Senha
              <a href="#" id="showForgotBtn" tabindex="-1" style="font-size: 0.85rem; color: var(--blue); text-decoration: none; font-weight: 800;">Esqueceu a senha?</a>
            </div>
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Acessar</button>
          <p class="message" id="message" role="status"></p>
        </form>

        <form id="registerForm" style="display: none;">
          <label>
            Nome e Sobrenome
            <input id="regName" type="text" required />
          </label>
          <label>
            E-mail
            <input id="regEmail" type="email" required />
          </label>
          <label>
            Senha (mínimo 6 caracteres)
            <input id="regPassword" type="password" minlength="6" required />
          </label>
          <button type="submit">Criar Conta</button>
          <p class="message" id="regMessage" role="status"></p>
        </form>

        <form id="forgotForm" style="display: none;">
          <label>
            E-mail cadastrado
            <input id="forgotEmail" type="email" placeholder="nome@email.com" required />
          </label>
          <button type="submit">Enviar link de recuperação</button>
          <button type="button" id="backToLoginBtn" style="background: transparent; color: var(--ink); border: 1px solid var(--line);">Voltar para o login</button>
          <p class="message" id="forgotMessage" role="status"></p>
        </form>

        <button id="toggleFormBtn" type="button" style="margin-top: 16px; width: 100%; background: transparent; color: var(--blue); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; font-weight: bold;">
          Não tem conta? Cadastre-se
        </button>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
      const currentUser = NextAuth.currentUser();
      if (currentUser) {
        window.location.href = "next.html";
      }

      const loginForm = document.querySelector("#loginForm");
      const registerForm = document.querySelector("#registerForm");
      const forgotForm = document.querySelector("#forgotForm");
      const toggleBtn = document.querySelector("#toggleFormBtn");
      const showForgotBtn = document.querySelector("#showForgotBtn");
      const backToLoginBtn = document.querySelector("#backToLoginBtn");
      const cardTitle = document.querySelector("#cardTitle");
      const cardDesc = document.querySelector("#cardDesc");

      // Alternar entre Login e Cadastro
      toggleBtn.addEventListener("click", () => {
        const isLogin = loginForm.style.display !== "none";
        loginForm.style.display = isLogin ? "none" : "grid";
        registerForm.style.display = isLogin ? "grid" : "none";
        cardTitle.textContent = isLogin ? "Criar Conta" : "Entrar";
        cardDesc.textContent = isLogin ? "Preencha seus dados para começar." : "Use uma conta cadastrada ou crie a sua.";
        toggleBtn.textContent = isLogin ? "Já tenho conta. Fazer login" : "Não tem conta? Cadastre-se";
      });

      // Mostrar formulário de "Esqueceu a senha"
      showForgotBtn.addEventListener("click", (e) => {
        e.preventDefault();
        loginForm.style.display = "none";
        registerForm.style.display = "none";
        forgotForm.style.display = "grid";
        toggleBtn.style.display = "none";
        cardTitle.textContent = "Recuperar Senha";
        cardDesc.textContent = "Enviaremos um link de recuperação para o seu e-mail.";
      });

      // Voltar para o Login
      backToLoginBtn.addEventListener("click", () => {
        forgotForm.style.display = "none";
        loginForm.style.display = "grid";
        toggleBtn.style.display = "block";
        cardTitle.textContent = "Entrar";
        cardDesc.textContent = "Use uma conta cadastrada ou crie a sua.";
        document.querySelector("#forgotMessage").textContent = "";
      });

      // Lógica de Login
      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        document.querySelector("#message").textContent = "Carregando...";
        const user = await NextAuth.login(document.querySelector("#email").value.trim(), document.querySelector("#password").value);
        if (!user) {
          document.querySelector("#message").textContent = "E-mail ou senha inválidos.";
          return;
        }
        window.location.href = "next.html";
      });

      // Lógica de Cadastro
      registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        document.querySelector("#regMessage").textContent = "Criando conta...";
        const name = document.querySelector("#regName").value.trim();
        const email = document.querySelector("#regEmail").value.trim();
        const password = document.querySelector("#regPassword").value;

        const user = await NextAuth.register(name, email, password);
        if (!user) {
          document.querySelector("#regMessage").textContent = "Erro ao criar conta. Tente outro e-mail.";
          return;
        }
        window.location.href = "next.html"; // Redireciona logado
      });

      // Lógica de Recuperação de Senha
      forgotForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const msg = document.querySelector("#forgotMessage");
        msg.textContent = "Enviando...";
        msg.style.color = "var(--ink)";
        
        await NextAuth.resetPassword(document.querySelector("#forgotEmail").value.trim());
        
        msg.textContent = "Se o e-mail estiver cadastrado, você receberá um link de recuperação.";
        msg.style.color = "#10b981"; // Cor verde
        document.querySelector("#forgotEmail").value = "";
      });
    </script>
  </body>
</html>

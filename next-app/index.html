<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Next</title>
    <style>
      :root {
        --blue: #2f73f8;
        --ink: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --soft: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(135deg, rgba(47, 115, 248, 0.12), transparent 36%),
          var(--soft);
        color: var(--ink);
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      .login-shell {
        width: min(980px, 100%);
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(320px, 0.68fr);
        gap: 20px;
        align-items: stretch;
      }

      .intro,
      .login-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 18px 60px rgba(17, 24, 39, 0.1);
      }

      .intro {
        min-height: 520px;
        display: grid;
        align-content: space-between;
        padding: 28px;
        color: #fff;
        background:
          linear-gradient(135deg, rgba(47, 115, 248, 0.95), rgba(17, 24, 39, 0.88)),
          #2f73f8;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand img {
        width: 58px;
        height: 58px;
        border-radius: 8px;
        object-fit: cover;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: rgba(255, 255, 255, 0.68);
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .intro h1 {
        max-width: 620px;
        margin: 0 0 12px;
        font-size: clamp(2.5rem, 6vw, 4.8rem);
        line-height: 0.98;
      }

      .intro p {
        max-width: 520px;
        margin: 0;
        color: rgba(255, 255, 255, 0.78);
        font-weight: 650;
      }

      .login-card {
        padding: 24px;
      }

      .login-card h2 {
        margin: 0 0 6px;
        font-size: 1.6rem;
      }

      .login-card > p {
        margin: 0 0 20px;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 8px;
        color: #374151;
        font-weight: 800;
      }

      input {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        color: var(--ink);
        font: inherit;
        outline: none;
      }

      input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(47, 115, 248, 0.12);
      }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: var(--blue);
        color: #fff;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      .message {
        min-height: 22px;
        margin: 0;
        color: #b91c1c;
        font-weight: 750;
      }

      @media (max-width: 820px) {
        body {
          padding: 14px;
        }

        .login-shell {
          grid-template-columns: 1fr;
        }

        .intro {
          min-height: 360px;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <section class="intro">
        <div class="brand">
          <img src="assets/next-logo.svg" alt="Next" />
          <div>
            <p class="eyebrow">AD Fonte de Vida</p>
            <strong>Juventude Next</strong>
          </div>
        </div>

        <div>
          <p class="eyebrow">Entrar no app</p>
          <h1>Seu próximo passo com o Next</h1>
          <p>Acesse avisos, agenda, pedidos de oração, loja, conteúdos e conversas com a liderança.</p>
        </div>
      </section>

      <section class="login-card">
        <h2 id="cardTitle">Entrar</h2>
        <p id="cardDesc">Use uma conta cadastrada ou crie a sua.</p>

        <form id="loginForm">
          <label>
            E-mail
            <input id="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Senha
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Acessar</button>
          <p class="message" id="message" role="status"></p>
        </form>

        <form id="registerForm" style="display: none;">
          <label>
            Nome e Sobrenome
            <input id="regName" type="text" required />
          </label>
          <label>
            E-mail
            <input id="regEmail" type="email" required />
          </label>
          <label>
            Senha (mínimo 6 caracteres)
            <input id="regPassword" type="password" minlength="6" required />
          </label>
          <button type="submit">Criar Conta</button>
          <p class="message" id="regMessage" role="status"></p>
        </form>

        <button id="toggleFormBtn" type="button" style="margin-top: 16px; width: 100%; background: transparent; color: var(--blue); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; font-weight: bold;">
          Não tem conta? Cadastre-se
        </button>
      </section>
    </main>

    <script src="supabase-config.js"></script>
    <script>
      const currentUser = NextAuth.currentUser();
      if (currentUser) {
        window.location.href = "next.html";
      }

      const loginForm = document.querySelector("#loginForm");
      const registerForm = document.querySelector("#registerForm");
      const toggleBtn = document.querySelector("#toggleFormBtn");
      const cardTitle = document.querySelector("#cardTitle");

      // Alternar entre Login e Cadastro
      toggleBtn.addEventListener("click", () => {
        const isLogin = loginForm.style.display !== "none";
        loginForm.style.display = isLogin ? "none" : "grid";
        registerForm.style.display = isLogin ? "grid" : "none";
        cardTitle.textContent = isLogin ? "Criar Conta" : "Entrar";
        toggleBtn.textContent = isLogin ? "Já tenho conta. Fazer login" : "Não tem conta? Cadastre-se";
      });

      // Lógica de Login
      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        document.querySelector("#message").textContent = "Carregando...";
        const user = await NextAuth.login(document.querySelector("#email").value.trim(), document.querySelector("#password").value);
        if (!user) {
          document.querySelector("#message").textContent = "E-mail ou senha inválidos.";
          return;
        }
        window.location.href = "next.html";
      });

      // Lógica de Cadastro
      registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        document.querySelector("#regMessage").textContent = "Criando conta...";
        const name = document.querySelector("#regName").value.trim();
        const email = document.querySelector("#regEmail").value.trim();
        const password = document.querySelector("#regPassword").value;

        const user = await NextAuth.register(name, email, password);
        if (!user) {
          document.querySelector("#regMessage").textContent = "Erro ao criar conta. Tente outro e-mail.";
          return;
        }
        window.location.href = "next.html"; // Redireciona logado
      });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="supabase-config.js"></script>
    
    <script src="next.js"></script>
  </body>
</html>
